    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('paymentModal');
            const openBtns = document.querySelectorAll('.open-modal, .btn-pricing, .btn');
            const closeBtn = document.getElementById('closeModal');

            openBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Если это кнопка тарифа, показываем окно
                    if (btn.classList.contains('open-modal') || btn.classList.contains('btn-pricing')) {
                        e.preventDefault();
                        if (modal) modal.style.display = 'flex';
                    } 
                    // Если это главная кнопка, плавно скроллим вниз
                    else if (btn.getAttribute('href') === '#tariffs') {
                        e.preventDefault();
                        const target = document.getElementById('tariffs');
                        if (target) target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
